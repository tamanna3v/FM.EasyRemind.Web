<title>EasyRemind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: left rail nav on desktop, bottom tab bar on phone; one scrolling content column with summary-first panels. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9efed; --line:#d5ddda;
  --fg:#15211e; --fg-2:#56655f; --fg-3:#8a9893;
  --accent:#0f7b74; --accent-fg:#ffffff; --accent-soft:#dcefec;
  --warn:#b4720a; --warn-soft:#fbefd6; --crit:#b9342c; --crit-soft:#fbe2df; --ok:#2a7d4f; --ok-soft:#ddf1e4;
  --font-display:"Manrope","Noto Sans Bengali",system-ui,sans-serif;
  --font-body:"Manrope","Noto Sans Bengali",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:12px; --shadow:0 1px 2px rgba(21,33,30,.06),0 4px 16px rgba(21,33,30,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#161e1c; --surface-2:#1f2927; --line:#2b3835;
  --fg:#e8eeec; --fg-2:#a4b2ad; --fg-3:#6f7f79;
  --accent:#3fb8ae; --accent-fg:#06211e; --accent-soft:#163532;
  --warn:#e3a53a; --warn-soft:#3a2d12; --crit:#ee7a71; --crit-soft:#3d1c1a; --ok:#5fc48a; --ok-soft:#163626;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#161e1c; --surface-2:#1f2927; --line:#2b3835;
  --fg:#e8eeec; --fg-2:#a4b2ad; --fg-3:#6f7f79;
  --accent:#3fb8ae; --accent-fg:#06211e; --accent-soft:#163532;
  --warn:#e3a53a; --warn-soft:#3a2d12; --crit:#ee7a71; --crit-soft:#3d1c1a; --ok:#5fc48a; --ok-soft:#163626;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="bn"] body{font-family:"Noto Sans Bengali","Manrope",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.small{font-size:.82rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-family:var(--font-display)}
.brand b{font-family:var(--font-display);font-size:1.05rem;font-weight:800}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:9px;text-align:left;font-weight:600;color:var(--fg-2)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button.active{background:var(--accent-soft);color:var(--accent)}
.nav button:hover:not(.active){background:var(--surface-2)}
.nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail .spacer{flex:1}
.main{min-width:0;padding-block:22px 90px;padding-inline:clamp(16px,4vw,40px);max-width:1100px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .sub{color:var(--fg-2);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn svg{width:16px;height:16px}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:16px;height:16px}

.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.panel.hero{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.panel.hero .label{color:var(--accent-fg);opacity:.75}
.panel.hero .big{font-size:2.2rem;font-weight:800;line-height:1.1;margin:6px 0 4px}
.panel .big{font-size:1.9rem;font-weight:800;line-height:1.1;margin:6px 0 4px;font-family:var(--font-display)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#fff;flex:none;font-family:var(--font-display)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.today{background:var(--crit-soft);color:var(--crit)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.creep{background:var(--crit-soft);color:var(--crit)}
.pill.trial{background:var(--accent-soft);color:var(--accent)}

/* subs list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
.toolbar input{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .price{font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.card .pills{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--fg-2);border:1px dashed var(--line);border-radius:var(--radius)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--fg-3);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal .day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.other{opacity:.4}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d{font-size:.78rem;font-weight:700;color:var(--fg-2)}
.cal .ev{font-size:.72rem;padding:2px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal .ev.paid{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.cal .more{font-size:.7rem;color:var(--fg-3)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.bar i.past{background:var(--fg-3);opacity:.5}
.bar i.cur{background:var(--accent)}
.bar small{font-size:.66rem;color:var(--fg-3);white-space:nowrap}
.bar b{font-size:.66rem;font-family:var(--font-mono);color:var(--fg-2)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat .r{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.cat .r .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cat .r .t i{display:block;height:100%;background:var(--accent)}
.cat .r.cat-ent i{background:#c2553f}.cat .r.cat-ai i{background:#5b6ee1}.cat .r.cat-prod i{background:#0f7b74}
.cat .r.cat-cloud i{background:#8a63d2}.cat .r.cat-util i{background:#b4720a}.cat .r.cat-health i{background:#2a7d4f}
.cat .r.cat-edu i{background:#2f80b5}.cat .r.cat-fin i{background:#6b7f78}.cat .r.cat-other i{background:#9aa5a1}
.ring{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring svg{width:120px;height:120px}

/* table */
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.tw{overflow-x:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,15,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:5px}
.field label{font-size:.8rem;font-weight:700;color:var(--fg-2)}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%}
.field textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc-list{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto}
.svc-list button{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.svc-list button:hover{border-color:var(--accent)}
.svc-list .dot{width:12px;height:12px;border-radius:4px}
.steps{padding-left:20px;margin:0;display:grid;gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;border:0;background:var(--surface);font-weight:600;font-size:.85rem}
.seg button.on{background:var(--accent);color:var(--accent-fg)}

/* reminder banner */
.remind{position:fixed;right:18px;bottom:18px;width:min(360px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px;box-shadow:var(--shadow);z-index:40;display:grid;gap:8px}
.remind .row{align-items:flex-start}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}

/* app rail (right edge): switch between EasyRemind and Tasks */
.app{grid-template-columns:220px 1fr 64px}
.apprail{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px}
.apprail button{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--fg-3);position:relative;margin-top:10px}
.apprail button svg{width:22px;height:22px}
.apprail button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.apprail button:hover:not(.active){background:var(--surface-2)}
.apprail .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center;font-family:var(--font-mono)}
.apprail .lbl{font-size:.62rem;font-weight:700;color:var(--fg-3);text-align:center;letter-spacing:.03em}
.apprail .spacer{flex:1}
.apprail .sw{width:36px;height:36px;margin:0;border-color:var(--line)}
.apprail .sw svg{width:16px;height:16px}

/* tasks module */
.tk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.tk.nodetail{grid-template-columns:1fr}
.qadd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.qadd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qadd svg{width:18px;height:18px;color:var(--accent);flex:none}
.qadd input{flex:1;border:0;background:transparent;outline:none;font-size:.98rem;min-width:0}
.qadd .hint{font-size:.72rem;color:var(--fg-3);white-space:nowrap}
.tlist{display:flex;flex-direction:column;gap:3px}
.tsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 6px 5px;display:flex;gap:8px;align-items:center}
.tsec b{font-family:var(--font-mono);color:var(--fg-3);font-weight:600}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;background:var(--surface);border:1px solid var(--line);min-width:0}
.trow:hover{border-color:var(--accent)}
.trow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.trow.done{opacity:.55}
.trow.done .tt{text-decoration:line-through}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg-3);flex:none;margin-top:3px;display:grid;place-items:center;background:transparent;padding:0}
.chk.p1{border-color:var(--crit)}.chk.p2{border-color:var(--warn)}.chk.p3{border-color:#2f80b5}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk svg{width:11px;height:11px}
.trow .tt{font-weight:600;line-height:1.35;word-break:break-word}
.trow .tm{display:flex;gap:9px;flex-wrap:wrap;font-size:.76rem;color:var(--fg-3);margin-top:2px;align-items:center}
.trow .tm .due{display:inline-flex;align-items:center;gap:3px}
.trow .tm .due svg{width:12px;height:12px}
.trow .tm .due.over{color:var(--crit);font-weight:700}.trow .tm .due.td{color:var(--accent);font-weight:700}
.tag{padding:0 6px;border-radius:5px;background:var(--surface-2);color:var(--fg-2);font-weight:600}
.lst{font-weight:700}
.detail{position:sticky;top:22px}
.detail textarea{min-height:110px}
.detail .title-in{font-size:1.05rem;font-weight:700;border:0;background:transparent;padding:4px 0;width:100%;outline:none;font-family:var(--font-display)}
.subt{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.subt:last-child{border-bottom:0}
.subt input[type=text]{flex:1;border:0;background:transparent;outline:none;min-width:0}
.subt.done span{text-decoration:line-through;color:var(--fg-3)}
.subt .chk{margin:0;width:16px;height:16px}
.navsub{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 10px 4px;display:flex;justify-content:space-between;align-items:center}
.nav button .cnt{margin-left:auto;font-size:.72rem;color:var(--fg-3);font-family:var(--font-mono)}
.nav button .dotc{width:10px;height:10px;border-radius:3px;flex:none;margin:0 4px}
.prisel{display:flex;gap:6px}
.prisel button{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600}
.prisel button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.prisel button[data-tpri="1"].on{background:var(--crit);border-color:var(--crit);color:#fff}
.prisel button[data-tpri="2"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.prisel button[data-tpri="3"].on{background:#2f80b5;border-color:#2f80b5;color:#fff}
.kbd{font-family:var(--font-mono);font-size:.7rem;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}

/* bottom tabs on phone */
.tabs{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail,.apprail{display:none}
  .tk{grid-template-columns:1fr}
  .tk .detail{display:none}
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:700;color:var(--fg-3);padding:4px 0}
  .tabs button svg{width:20px;height:20px}
  .tabs button.active{color:var(--accent)}
  .g3,.g2,.f2{grid-template-columns:1fr}
  .cal .day{min-height:54px;padding:4px}
  .cal .ev{font-size:.62rem;padding:1px 3px}
  .ring{grid-template-columns:1fr}
  .cat .r{grid-template-columns:80px 1fr auto}
  .remind{right:12px;left:12px;bottom:76px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><div class="mark">R</div><b>EasyRemind</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="small muted" style="padding:0 8px">remind.easydo.ai<br>v1.3 · <span id="count-foot"></span></div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="apprail" id="apprail"></aside>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>

<script>
/* ============ i18n ============ */
const T = {
en:{
  dashboard:"Overview", subs:"Subscriptions", calendar:"Calendar", analytics:"Analytics", settings:"Settings",
  add:"Add subscription", perMonth:"per month", perYear:"per year", active:"active",
  monthlyTotal:"You pay every month", yearlyTotal:"That is per year", upcoming:"Next 14 days",
  nothingSoon:"Nothing charges in the next 14 days.", today:"today", tomorrow:"tomorrow", inDays:"in {n} days",
  overdue:"{n} days ago", paid:"Paid", snooze:"Snooze", markPaid:"Mark paid", byCategory:"By category",
  creepTitle:"Prices that went up", creepNone:"No price rises recorded yet. Edit a subscription's price to track it.",
  search:"Search…", allCats:"All categories", allStatus:"All statuses", sortNext:"Next charge", sortPrice:"Price", sortName:"Name",
  emptySubs:"No subscriptions yet. Add the first one and the totals appear here.",
  st_active:"Active", st_trial:"Trial", st_paused:"Paused", st_cancelled:"Cancelled",
  cy_weekly:"Weekly", cy_monthly:"Monthly", cy_quarterly:"Quarterly", cy_yearly:"Yearly",

/* ============ Dates & money ============ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayD=()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const addCycle=(d,cycle,k=1)=>{ const n=new Date(d); const c=CYCLES[cycle]; if(c.d) n.setDate(n.getDate()+c.d*k); else { const day=n.getDate(); n.setDate(1); n.setMonth(n.getMonth()+c.m*k); const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(); n.setDate(Math.min(day,last)); } return n; };
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
function nextCharge(sub,from=todayD()){ let d=parse(sub.first); let guard=0; while(d<from&&guard++<2000) d=addCycle(d,sub.cycle); return d; }
function chargesBetween(sub,a,b){ const out=[]; let d=parse(sub.first); let g=0; while(d<a&&g++<2000) d=addCycle(d,sub.cycle); while(d<=b&&g++<4000){ out.push(new Date(d)); d=addCycle(d,sub.cycle);} return out; }
const monthly=sub=>sub.amount*CYCLES[sub.cycle].n;
function conv(amt,from,to=S.settings.cur){ const r=S.settings.rates; const f=r[from]||1, tt=r[to]||1; return amt/f*tt; }
function fmt(amt,cur=S.settings.cur){ const sym={BDT:"৳",USD:"$",EUR:"€",GBP:"£",INR:"₹"}[cur]||cur+" "; const n=amt>=1000?Math.round(amt).toLocaleString("en-US"):amt.toFixed(2); return sym+n; }
const fmtIn=(amt,from)=>fmt(conv(amt,from));
function fmtDate(d){ return d.getDate()+" "+t("months")[d.getMonth()]+(d.getFullYear()!==todayD().getFullYear()?" "+d.getFullYear():""); }
function relDay(d){ const n=daysBetween(todayD(),d); if(n===0) return t("today"); if(n===1) return t("tomorrow"); if(n<0) return t("overdue",{n:-n}); return t("inDays",{n}); }
const chargeKey=(sub,d)=>sub.id+"|"+iso(d);
const chargeState=(sub,d)=>S.charges[chargeKey(sub,d)]||{status:"upcoming"};

const VIEWS=[["dashboard",I.home],["subs",I.list],["calendar",I.cal],["analytics",I.chart],["settings",I.gear]];
const TVIEWS=[["inbox",I.inbox],["today",I.sun],["week",I.cal],["all",I.list],["done",I.check]];
/* hash: "#dashboard" … for EasyRemind, "#tasks/today", "#tasks/list:work", "#tasks/tag:bills" for Tasks */
let app="remind", view="dashboard", tview="today";
function readHash(){ const h=(location.hash||"#dashboard").slice(1); if(h.startsWith("tasks")){ app="tasks"; tview=h.split("/")[1]||"today"; } else { app="remind"; view=VIEWS.some(v=>v[0]===h)?h:"dashboard"; } }
readHash();
let calMonth=new Date(todayD().getFullYear(),todayD().getMonth(),1);
let filt={q:"",cat:"",status:"",sort:"next"};
function go(v){ app="remind"; view=v; location.hash=v; render(); window.scrollTo(0,0); }
function tgo(v){ app="tasks"; tview=v; tsel=null; location.hash="tasks/"+v; render(); window.scrollTo(0,0); }
function setApp(a){ if(a==="tasks") tgo(tview); else go(view); }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isMobile=()=>!!(window.matchMedia&&window.matchMedia("(max-width:820px)").matches);

function render(){
  applyTheme();
  document.documentElement.lang=S.settings.lang;
  const sw=a=>`<button data-app="${a}">${a==="tasks"?I.checkSq:I.bell}${a==="tasks"?t("tasks"):t("remindApp")}</button>`;
  if(app==="tasks"){
    document.getElementById("nav").innerHTML=tNavHtml();
    document.getElementById("tabs").innerHTML=TVIEWS.slice(0,4).map(([v,ic])=>`<button class="${v===tview?"active":""}" data-tgo="${v}">${ic}${t("tk_"+v)}</button>`).join("")+sw("remind");
    document.getElementById("count-foot").textContent=S.tasks.filter(x=>!x.done).length+" "+t("tk_tasksFoot");
    document.getElementById("main").innerHTML=rTasks();
  } else {
    document.getElementById("nav").innerHTML=VIEWS.map(([v,ic])=>`<button class="${v===view?"active":""}" data-go="${v}">${ic}${t(v)}</button>`).join("");
    document.getElementById("tabs").innerHTML=VIEWS.map(([v,ic])=>`<button class="${v===view?"active":""}" data-go="${v}">${ic}${t(v)}</button>`).join("")+sw("tasks");
    document.getElementById("count-foot").textContent=S.subs.filter(isLive).length+" "+t("active");
    document.getElementById("main").innerHTML=({dashboard:rDash,subs:rSubs,calendar:rCal,analytics:rAna,settings:rSet})[view]();
  }
  document.getElementById("apprail").innerHTML=railHtml();
  bind();
  checkReminders();
}
function railHtml(){ const td=iso(todayD()); const n=S.tasks.filter(x=>!x.done&&x.due&&x.due<=td).length;
  return `<button class="${app==="remind"?"active":""}" data-app="remind" title="EasyRemind">${I.bell}</button><div class="lbl">${t("remindApp")}</div>
  <button class="${app==="tasks"?"active":""}" data-app="tasks" title="${t("tasks")}">${I.checkSq}${n?`<span class="badge">${n}</span>`:""}</button><div class="lbl">${t("tasks")}</div>
  <div class="spacer"></div><button class="sw" data-go="settings" title="${t("settings")}">${I.gear}</button>`; }
function applyTheme(){ const th=S.settings.theme; if(th==="system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",th); }

/* ============ Views ============ */
function logoHtml(sub,size=36){ return `<div class="logo" style="background:${colorOf(sub)};width:${size}px;height:${size}px">${esc(initials(sub.name))}</div>`; }
function hasCreep(sub){ return sub.history&&sub.history.length&&sub.history[sub.history.length-1].amount<sub.amount; }

function rDash(){
  const live=S.subs.filter(isLive);
  const mo=live.reduce((a,s)=>a+conv(monthly(s),s.cur),0);
  const td=todayD(), end=new Date(td); end.setDate(end.getDate()+14);
  const up=[]; live.forEach(s=>chargesBetween(s,td,end).forEach(d=>up.push({s,d,st:chargeState(s,d)})));
  up.sort((a,b)=>a.d-b.d);
  const byCat={}; live.forEach(s=>{byCat[s.cat]=(byCat[s.cat]||0)+conv(monthly(s),s.cur)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const creep=live.filter(hasCreep);
  const thisMonthStart=new Date(td.getFullYear(),td.getMonth(),1), thisMonthEnd=new Date(td.getFullYear(),td.getMonth()+1,0);
  const thisMonth=live.reduce((a,s)=>a+chargesBetween(s,thisMonthStart,thisMonthEnd).length*conv(s.amount,s.cur),0);
  return `
  <div class="topbar"><div><h1>${t("dashboard")}</h1><div class="sub">${live.length} ${t("active")} · ${fmtDate(td)}</div></div>
   <div class="actions"><button class="btn primary" data-add>${I.plus}${t("add")}</button></div></div>
  ${S.sampleLoaded&&S.subs.some(s=>s.sample)?`<div class="small muted" style="margin:-8px 0 14px">${t("sample")} <button class="btn sm" data-clear-sample style="margin-left:6px">${t("clearSample")}</button></div>`:""}
  <div class="grid g3" style="margin-bottom:14px">
    <div class="panel hero"><div class="label">${t("monthlyTotal")}</div><div class="big num">${fmt(mo)}</div><div class="small" style="opacity:.8">${t("thisMonth")}: <span class="num">${fmt(thisMonth)}</span></div></div>
    <div class="panel"><div class="label">${t("yearlyTotal")}</div><div class="big num">${fmt(mo*12)}</div><div class="small muted">${t("yearForecastNote")}</div></div>
    <div class="panel"><div class="label">${t("creepTitle")}</div><div class="big num" style="color:${creep.length?"var(--crit)":"inherit"}">${creep.length}</div><div class="small muted">${creep.length?creep.map(s=>esc(s.name)).join(", "):t("creepNone")}</div></div>
  </div>
  <div class="grid g2">
    <div class="panel"><div class="panel-h"><h2>${t("upcoming")}</h2><button class="btn sm" data-go="calendar">${t("calendar")}</button></div>
      ${up.length?`<div class="stack">${up.map(u=>`<div class="row">${logoHtml(u.s,32)}<div class="grow"><div class="ellip" style="font-weight:600">${esc(u.s.name)}</div><div class="small muted">${fmtDate(u.d)} · ${esc(u.s.method||"")}</div></div>
        <div style="text-align:right"><div class="num" style="font-weight:700">${fmtIn(u.s.amount,u.s.cur)}</div>${u.st.status==="paid"?`<span class="pill ok">${t("paid")}</span>`:`<span class="pill ${daysBetween(td,u.d)<=0?"today":daysBetween(td,u.d)<=3?"soon":"neutral"}">${relDay(u.d)}</span>`}</div>
        ${u.st.status!=="paid"?`<button class="iconbtn" title="${t("markPaid")}" data-paid="${u.s.id}|${iso(u.d)}">✓</button>`:""}</div>`).join("")}</div>`:`<div class="empty">${t("nothingSoon")}</div>`}
    </div>
    <div class="panel"><div class="panel-h"><h2>${t("byCategory")}</h2><span class="small muted">${t("perMonth")}</span></div>
      ${cats.length?`<div class="cat">${cats.map(([c,v])=>`<div class="r cat-${c}"><span class="ellip">${t("cats")[c]}</span><div class="t"><i style="width:${(v/mo*100).toFixed(1)}%"></i></div><span class="num">${fmt(v)}</span></div>`).join("")}</div>`:`<div class="empty">${t("emptySubs")}</div>`}
    </div>
  </div>`;
}

function rSubs(){
  let list=S.subs.slice();
  if(filt.q) list=list.filter(s=>s.name.toLowerCase().includes(filt.q.toLowerCase())||(s.notes||"").toLowerCase().includes(filt.q.toLowerCase()));
  if(filt.cat) list=list.filter(s=>s.cat===filt.cat);
  if(filt.status) list=list.filter(s=>s.status===filt.status);
  const td=todayD();
  list.sort((a,b)=>filt.sort==="price"?conv(monthly(b),b.cur)-conv(monthly(a),a.cur):filt.sort==="name"?a.name.localeCompare(b.name):(isLive(a)?nextCharge(a):Infinity)-(isLive(b)?nextCharge(b):Infinity));
  return `
  <div class="topbar"><div><h1>${t("subs")}</h1><div class="sub">${S.subs.length} ${t("total").toLowerCase()} · ${S.subs.filter(isLive).length} ${t("active")}</div></div>
   <div class="actions"><button class="btn primary" data-add>${I.plus}${t("add")}</button></div></div>
  <div class="toolbar">
    <input id="fl-q" placeholder="${t("search")}" value="${esc(filt.q)}">

function rAna(){
  const live=S.subs.filter(isLive); const td=todayD();
  const months=[]; for(let i=-6;i<=11;i++){ const a=new Date(td.getFullYear(),td.getMonth()+i,1), b=new Date(td.getFullYear(),td.getMonth()+i+1,0); let v=0;
    S.subs.forEach(s=>{ if(!isLive(s)&&!(s.cancelled&&parse(s.cancelled)>a)) return; chargesBetween(s,a,b).forEach(d=>{ if(s.cancelled&&d>parse(s.cancelled)) return; const h=priceAt(s,d); v+=conv(h.amount,h.cur); }); });
    months.push({a,v,i}); }
  const max=Math.max(...months.map(x=>x.v),1);
  const fut=months.filter(x=>x.i>=0), past=months.filter(x=>x.i<0);
  const avgF=fut.reduce((a,x)=>a+x.v,0)/fut.length, avgP=past.reduce((a,x)=>a+x.v,0)/past.length;
  const byCat={}; live.forEach(s=>{byCat[s.cat]=(byCat[s.cat]||0)+conv(monthly(s),s.cur)}); const mo=Object.values(byCat).reduce((a,b)=>a+b,0)||1;
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const palette={ent:"#c2553f",ai:"#5b6ee1",prod:"#0f7b74",cloud:"#8a63d2",util:"#b4720a",health:"#2a7d4f",edu:"#2f80b5",fin:"#6b7f78",other:"#9aa5a1"};
  let acc=0; const arcs=cats.map(([c,v])=>{ const p=v/mo; const s=acc; acc+=p; return `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${palette[c]}" stroke-width="6" stroke-dasharray="${(p*100).toFixed(2)} ${(100-p*100).toFixed(2)}" stroke-dashoffset="${(25-s*100).toFixed(2)}"/>`; }).join("");
  const sorted=live.slice().sort((a,b)=>conv(monthly(a),a.cur)-conv(monthly(b),b.cur));
  const oldest=live.slice().sort((a,b)=>parse(a.first)-parse(b.first))[0];
  const creep=S.subs.filter(hasCreep);
  return `
  <div class="topbar"><div><h1>${t("analytics")}</h1><div class="sub">${t("yearForecastNote")}</div></div></div>
  <div class="panel" style="margin-bottom:14px"><div class="panel-h"><h2>${t("forecast")}</h2><span class="small muted">${t("avg")} <span class="num">${fmt(avgF)}</span>${t("perMonthShort")}</span></div>
    <div class="bars">${months.map(x=>`<div class="bar"><b>${x.v>=1000?Math.round(x.v/1000)+"k":Math.round(x.v)}</b><i class="${x.i<0?"past":x.i===0?"cur":""}" style="height:${(x.v/max*100).toFixed(1)}%"></i><small>${t("months")[x.a.getMonth()]}</small></div>`).join("")}</div>
    <div class="small muted" style="margin-top:8px">${t("history")}: ${t("avg")} <span class="num">${fmt(avgP)}</span>${t("perMonthShort")} (6 mo) → ${t("forecast").toLowerCase()} <span class="num">${fmt(avgF)}</span>${t("perMonthShort")}</div></div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="panel"><div class="panel-h"><h2>${t("catSplit")}</h2></div>
      ${cats.length?`<div class="ring"><svg viewBox="0 0 42 42" role="img">${arcs}<text x="21" y="22" text-anchor="middle" font-size="5" font-weight="700" fill="var(--fg)" font-family="var(--font-mono)">${fmt(mo)}</text></svg>
      <div class="cat">${cats.map(([c,v])=>`<div class="r cat-${c}"><span class="ellip">${t("cats")[c]}</span><div class="t"><i style="width:${(v/mo*100).toFixed(1)}%"></i></div><span class="num">${Math.round(v/mo*100)}%</span></div>`).join("")}</div></div>`:`<div class="empty">${t("emptySubs")}</div>`}</div>
    <div class="panel"><div class="panel-h"><h2>${t("creepTitle")}</h2></div>
      ${creep.length?`<div class="stack">${creep.map(s=>{ const h=s.history[s.history.length-1]; const pct=Math.round((s.amount-h.amount)/h.amount*100); return `<div class="row">${logoHtml(s,32)}<div class="grow"><div class="ellip" style="font-weight:600">${esc(s.name)}</div><div class="small muted">${t("wasNow",{a:fmt(h.amount,s.cur),b:fmt(s.amount,s.cur)})}</div></div><span class="pill creep">${I.up} ${pct}%</span></div>`;}).join("")}</div>`:`<div class="empty">${t("creepNone")}</div>`}</div>
  </div>
  ${live.length?`<div class="grid g3">
    <div class="panel"><div class="label">${t("priciest")}</div><div class="row" style="margin-top:8px">${logoHtml(sorted[sorted.length-1],32)}<div class="grow"><div class="ellip" style="font-weight:700">${esc(sorted[sorted.length-1].name)}</div><div class="small muted num">${fmtIn(monthly(sorted[sorted.length-1]),sorted[sorted.length-1].cur)}${t("perMonthShort")}</div></div></div></div>
    <div class="panel"><div class="label">${t("cheapest")}</div><div class="row" style="margin-top:8px">${logoHtml(sorted[0],32)}<div class="grow"><div class="ellip" style="font-weight:700">${esc(sorted[0].name)}</div><div class="small muted num">${fmtIn(monthly(sorted[0]),sorted[0].cur)}${t("perMonthShort")}</div></div></div></div>
    <div class="panel"><div class="label">${t("oldest")}</div><div class="row" style="margin-top:8px">${logoHtml(oldest,32)}<div class="grow"><div class="ellip" style="font-weight:700">${esc(oldest.name)}</div><div class="small muted">${t("sinceD",{d:fmtDate(parse(oldest.first))})}</div></div></div></div>
  </div>`:""}`;
}
function priceAt(s,d){ if(!s.history||!s.history.length) return {amount:s.amount,cur:s.cur};
  // history entries: {amount: old price, cur, from: date the old price ended}
  for(const h of s.history){ if(parse(h.from)>d) return {amount:h.amount,cur:h.cur}; } return {amount:s.amount,cur:s.cur}; }

  S.tasksSeeded=true; if(!listOf("work")) S.lists.push({id:"work",name:"Work",color:"#5b6ee1"}); if(!listOf("personal")) S.lists.push({id:"personal",name:"Personal",color:"#2a7d4f"});
  [["Review this month's subscriptions in EasyRemind",d(0),1,"work",["finance"],[["Check price rises",false],["Cancel what I don't use",false]]],
   ["Pay internet bill",d(1),2,"personal",["bills"],[]],
   ["Call accountant about VAT return",d(3),2,"work",[],[]],
   ["Plan weekend trip",d(6),3,"personal",["family"],[]],
   ["Read the AI strategy paper",d(-1),0,"inbox",["reading"],[]],
   ["Renew passport",d(20),0,"personal",[],[]]
  ].forEach(([title,due,pri,list,tags,subs])=>S.tasks.push({id:uid(),title,notes:"",due,pri,list,tags,subs:subs.map(([tt,dn])=>({id:uid(),title:tt,done:dn})),done:false,created:Date.now(),sample:true}));
  persist(); }
const weekIso=()=>{ const x=todayD(); x.setDate(x.getDate()+7); return iso(x); };
const listOf=id=>S.lists.find(l=>l.id===id);
const slug=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")||uid();
if(!S.tasks.length&&!S.tasksSeeded){ seedTasks(); }

/* quick-add parser: dates (today/tomorrow/weekday/in N days/25/10/2026-10-25, Bangla আজ/কাল), !high/!med/!low, #tag, ~list */
function parseQuick(s){ const td=todayD(); let title=" "+s+" ", due="", pri=0, list=null, tags=[];
  const rep=(re,fn)=>{ title=title.replace(re,(...a)=>{ fn(...a); return " "; }); };
  const setD=n=>{ const x=new Date(td); x.setDate(x.getDate()+n); due=iso(x); };
  rep(/\s!(high|h|1)(?=\s)/gi,()=>pri=1); rep(/\s!(med|medium|m|2)(?=\s)/gi,()=>pri=2); rep(/\s!(low|l|3)(?=\s)/gi,()=>pri=3);
  rep(/\s#([\p{L}\p{N}_-]+)/gu,(m,tg)=>tags.push(tg.toLowerCase()));
  rep(/\s~([\p{L}\p{N}_-]+)/gu,(m,ln)=>{ const l=S.lists.find(x=>x.name.toLowerCase()===ln.toLowerCase()||x.id===ln.toLowerCase()); list=l?l.id:(/^inbox$/i.test(ln)?"inbox":list); });
  rep(/\s(\d{4}-\d{2}-\d{2})(?=\s)/,(m,d)=>due=d);
  rep(/\s(\d{1,2})\/(\d{1,2})(?=\s)/,(m,dd,mm)=>{ let x=new Date(td.getFullYear(),mm-1,dd); if(x<td) x=new Date(td.getFullYear()+1,mm-1,dd); due=iso(x); });
  rep(/\s(today|tod|আজ|আজকে)(?=\s)/i,()=>setD(0)); rep(/\s(tomorrow|tmr|tmrw|tom|কাল|কালকে|আগামীকাল)(?=\s)/i,()=>setD(1));
  rep(/\snext week(?=\s)/i,()=>setD(7)); rep(/\sআগামী সপ্তাহ(?=\s)/,()=>setD(7));
  rep(/\sin (\d+) days?(?=\s)/i,(m,n)=>setD(+n)); rep(/\s(\d+) দিন পর(?=\s)/,(m,n)=>setD(+n));
  rep(/\s(?:next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?=\s)/i,(m,d)=>{ const i=["sun","mon","tue","wed","thu","fri","sat"].indexOf(d.toLowerCase().slice(0,3)); let n=(i-td.getDay()+7)%7; if(n===0) n=7; setD(n); });
  return {title:title.replace(/\s+/g," ").trim(),due,pri,list,tags}; }

function addTask(raw){ const p=parseQuick(raw); if(!p.title) return;
  let list=p.list||"inbox", due=p.due, tags=p.tags;
  if(tview.startsWith("list:")&&!p.list) list=tview.slice(5);
  if(tview.startsWith("tag:")&&!tags.includes(tview.slice(4))) tags.push(tview.slice(4));
  if(tview==="today"&&!due) due=iso(todayD());
  const tk={id:uid(),title:p.title,notes:"",due,pri:p.pri,list,tags,subs:[],done:false,created:Date.now()};
  S.tasks.unshift(tk); persist(); render(); const el=document.getElementById("tq-add"); if(el) el.focus(); }
function toggleTask(id){ const x=S.tasks.find(y=>y.id===id); if(!x) return; x.done=!x.done; x.doneAt=x.done?Date.now():null; persist(); toast(x.done?t("tk_done1"):t("tk_restore")); render(); refreshMobileDetail(); }
function openTask(id){ tsel=id; render(); if(isMobile()) showModal(`<div style="padding:4px">${tDetail(id)}</div>`); }
function refreshMobileDetail(){ if(isMobile()&&tsel&&document.getElementById("tdetail")){ const x=S.tasks.find(y=>y.id===tsel); if(x) showModal(`<div style="padding:4px">${tDetail(tsel)}</div>`); else closeModal(); } }
function setField(id,f,v){ const x=S.tasks.find(y=>y.id===id); if(!x) return; if(f==="tags") x.tags=v.split(",").map(s=>s.trim().replace(/^#/,"").toLowerCase()).filter(Boolean); else x[f]=v; persist(); }

function tBase(v){ const td=iso(todayD()), wk=weekIso();
  if(v==="inbox") return x=>x.list==="inbox";
  if(v==="today") return x=>x.due&&x.due<=td;
  if(v==="week") return x=>x.due&&x.due<=wk;
  if(v==="all"||v==="done") return ()=>true;
  if(v.startsWith("list:")) return x=>x.list===v.slice(5);
  if(v.startsWith("tag:")) return x=>x.tags.includes(v.slice(4));
  return ()=>true; }
function tFilter(v,done=false){ const p=tBase(v); let l=S.tasks.filter(x=>p(x)&&x.done===(v==="done"?true:done));
  if(tq){ const q=tq.toLowerCase(); l=l.filter(x=>(x.title+" "+x.notes+" "+x.tags.join(" ")).toLowerCase().includes(q)); }
  return l; }
function tSort(l){ const pr=x=>x.pri===0?4:x.pri;
  return l.sort((a,b)=>{ if(tsort==="pri") return pr(a)-pr(b)||(a.due||"9999").localeCompare(b.due||"9999"); if(tsort==="created") return b.created-a.created; return (a.due||"9999").localeCompare(b.due||"9999")||pr(a)-pr(b)||b.created-a.created; }); }
function dowName(d){ return ({en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],bn:["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"]})[S.settings.lang][d.getDay()]; }
function tGroups(v,l){ const td=iso(todayD()), wk=weekIso();
  if(v==="done"){ const g={}; l.slice().sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).forEach(x=>{ const k=x.doneAt?iso(new Date(x.doneAt)):""; (g[k]=g[k]||[]).push(x); }); return Object.keys(g).sort().reverse().map(k=>[k?(k===td?t("tk_today"):fmtDate(parse(k))):"",g[k]]); }
  if(v==="week"||v==="today"){ const g={}; l.forEach(x=>{ const k=x.due<td?"0000-overdue":x.due; (g[k]=g[k]||[]).push(x); }); return Object.keys(g).sort().map(k=>[k==="0000-overdue"?t("tk_overdue"):k===td?t("tk_today"):fmtDate(parse(k))+" · "+dowName(parse(k)),g[k]]); }
  const g={over:[],today:[],week:[],later:[],none:[]}; l.forEach(x=>{ if(!x.due) g.none.push(x); else if(x.due<td) g.over.push(x); else if(x.due===td) g.today.push(x); else if(x.due<=wk) g.week.push(x); else g.later.push(x); });
  return [[t("tk_overdue"),g.over],[t("tk_today"),g.today],[t("tk_week"),g.week],[t("tk_later"),g.later],[t("tk_nodate"),g.none]].filter(x=>x[1].length); }

function tNavHtml(){ const td=iso(todayD()), wk=weekIso(); const open=x=>!x.done; const cnt=f=>S.tasks.filter(x=>open(x)&&f(x)).length;
  const smart=[["inbox",I.inbox,cnt(x=>x.list==="inbox")],["today",I.sun,cnt(x=>x.due&&x.due<=td)],["week",I.cal,cnt(x=>x.due&&x.due<=wk)],["all",I.list,cnt(()=>true)],["done",I.check,0]];
  let h=smart.map(([v,ic,c])=>`<button class="${tview===v?"active":""}" data-tgo="${v}">${ic}${t("tk_"+v)}${c?`<span class="cnt">${c}</span>`:""}</button>`).join("");
  h+=`<div class="navsub">${t("tk_lists")}<button class="iconbtn" style="width:22px;height:22px;border:0" data-tnewlist title="${t("tk_newList")}">${I.plus}</button></div>`;
  h+=S.lists.map(l=>`<button class="${tview==="list:"+l.id?"active":""}" data-tgo="list:${esc(l.id)}"><span class="dotc" style="background:${l.color}"></span><span class="ellip">${esc(l.name)}</span>${cnt(x=>x.list===l.id)?`<span class="cnt">${cnt(x=>x.list===l.id)}</span>`:""}</button>`).join("");
  const tags=[...new Set(S.tasks.filter(open).flatMap(x=>x.tags))].sort();
  if(tags.length) h+=`<div class="navsub">${t("tk_tags")}</div>`+tags.map(tg=>`<button class="${tview==="tag:"+tg?"active":""}" data-tgo="tag:${esc(tg)}">${I.tag}<span class="ellip">#${esc(tg)}</span></button>`).join("");
  return h; }

function tRow(x){ const td=iso(todayD()); const l=listOf(x.list); const ds=x.subs.filter(s=>s.done).length;
  return `<div class="trow ${x.done?"done":""} ${x.id===tsel?"sel":""}" data-topen="${x.id}" tabindex="0">
   <button class="chk p${x.pri} ${x.done?"on":""}" data-tdone="${x.id}" aria-label="toggle">${x.done?I.check:""}</button>
   <div class="grow"><div class="tt">${esc(x.title)}</div>
    <div class="tm">${x.due?`<span class="due ${x.due<td&&!x.done?"over":x.due===td?"td":""}">${I.calS}${relDay(parse(x.due))}</span>`:""}${x.subs.length?`<span>☰ ${ds}/${x.subs.length}</span>`:""}${x.notes?`<span>≡</span>`:""}${l?`<span class="lst" style="color:${l.color}">${esc(l.name)}</span>`:""}${x.tags.map(tg=>`<span class="tag">#${esc(tg)}</span>`).join("")}</div></div></div>`; }

function tDetail(id){ const x=S.tasks.find(y=>y.id===id); if(!x) return "";
  return `<div class="panel detail" id="tdetail">
   <div class="panel-h"><div class="row" style="gap:8px"><button class="chk p${x.pri} ${x.done?"on":""}" style="margin:0" data-tdone="${x.id}">${x.done?I.check:""}</button><span class="small muted">${x.done&&x.doneAt?t("tk_completedOn")+" "+fmtDate(new Date(x.doneAt)):t("tk_created")+" "+fmtDate(new Date(x.created))}</span></div>
    <div class="actions"><button class="iconbtn" data-tdel="${x.id}" title="${t("delete")}">${I.trash}</button><button class="iconbtn" data-tclose title="${t("cancel")}">${I.x}</button></div></div>
   <div class="stack" style="gap:12px">
    <input class="title-in" data-tf="title" data-tid="${x.id}" value="${esc(x.title)}">
    <div class="f2"><div class="field"><label>${t("tk_due")}</label><input type="date" data-tf="due" data-tid="${x.id}" value="${x.due}"></div>
     <div class="field"><label>${t("tk_list")}</label><select data-tf="list" data-tid="${x.id}"><option value="inbox" ${x.list==="inbox"?"selected":""}>${t("tk_inbox")}</option>${S.lists.map(l=>`<option value="${esc(l.id)}" ${l.id===x.list?"selected":""}>${esc(l.name)}</option>`).join("")}</select></div></div>
    <div class="field"><label>${t("tk_pri")}</label><div class="prisel">${[1,2,3,0].map(p=>`<button class="${x.pri===p?"on":""}" data-tpri="${p}" data-tid="${x.id}">${t("pri"+p)}</button>`).join("")}</div></div>
    <div class="field"><label>${t("tk_tagsF")}</label><input data-tf="tags" data-tid="${x.id}" value="${esc(x.tags.join(", "))}"></div>
    <div class="field"><label>${t("tk_sub")}</label><div>${x.subs.map(s=>`<div class="subt ${s.done?"done":""}"><button class="chk ${s.done?"on":""}" data-tsub="${x.id}|${s.id}">${s.done?I.check:""}</button><span class="grow">${esc(s.title)}</span><button class="iconbtn" style="width:26px;height:26px;border:0" data-tsubdel="${x.id}|${s.id}">${I.x}</button></div>`).join("")}
     <div class="subt"><span class="muted" style="width:16px;text-align:center">+</span><input type="text" id="td-newsub" data-tid="${x.id}" placeholder="${t("tk_addSub")}"></div></div></div>
    <div class="field"><label>${t("tk_notes")}</label><textarea data-tf="notes" data-tid="${x.id}">${esc(x.notes)}</textarea></div>
   </div></div>`; }

function rTasks(){ const l=tSort(tFilter(tview)); const groups=tGroups(tview,l);
  const doneExtra=tShowDone&&tview!=="done"?tFilter(tview,true).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)):[];
  const lo=tview.startsWith("list:")?listOf(tview.slice(5)):null;
  const title=tview.startsWith("list:")?(lo?lo.name:tview.slice(5)):tview.startsWith("tag:")?"#"+tview.slice(4):t("tk_"+tview);
  const td=todayD(); const over=S.tasks.filter(x=>!x.done&&x.due&&x.due<iso(td)).length;
  const sub=tview==="done"?`${l.length}`:`${l.length} ${t("tk_open")}${over&&tview!=="today"?` · <span style="color:var(--crit)">${over} ${t("tk_overdue").toLowerCase()}</span>`:""} · ${fmtDate(td)} ${dowName(td)}`;
  const showDetail=tsel&&!isMobile()&&S.tasks.some(x=>x.id===tsel);
  return `
  <div class="topbar"><div><h1>${esc(title)}</h1><div class="sub">${sub}</div></div>
   <div class="actions">${lo?`<button class="btn sm danger" data-tdellist="${esc(lo.id)}">${I.trash}${t("tk_delList")}</button>`:""}${tview==="done"?`<button class="btn sm" data-tclear-done>${t("tk_clearDone")}</button>`:`<button class="btn sm ${tShowDone?"primary":""}" data-tshowdone>${tShowDone?t("tk_hideDone"):t("tk_showDone")}</button>`}</div></div>
  ${S.tasks.some(x=>x.sample)?`<div class="small muted" style="margin:-8px 0 14px">${t("tk_sample")} <button class="btn sm" data-tclear-sample style="margin-left:6px">${t("tk_clearSample")}</button></div>`:""}
  <div class="tk ${showDetail?"":"nodetail"}"><div>
   ${tview!=="done"?`<div class="qadd">${I.plus}<input id="tq-add" placeholder="${t("tk_add")}" autocomplete="off"><span class="hint">${t("tk_hint")}</span></div><div class="small muted" style="margin:-6px 0 12px 4px">${t("tk_syntax")}</div>`:""}
   <div class="toolbar"><input id="tq-search" placeholder="${t("tk_search")}" value="${esc(tq)}"><select id="tq-sort"><option value="due" ${tsort==="due"?"selected":""}>${t("tk_sortDue")}</option><option value="pri" ${tsort==="pri"?"selected":""}>${t("tk_sortPri")}</option><option value="created" ${tsort==="created"?"selected":""}>${t("tk_sortCreated")}</option></select></div>
   ${groups.length?groups.map(([h,items])=>`${h?`<div class="tsec">${h}<b>${items.length}</b></div>`:""}<div class="tlist">${items.map(tRow).join("")}</div>`).join(""):`<div class="empty">${t("tk_empty")}</div>`}
   ${doneExtra.length?`<div class="tsec">${t("tk_done")}<b>${doneExtra.length}</b></div><div class="tlist">${doneExtra.map(tRow).join("")}</div>`:""}
  </div>${showDetail?tDetail(tsel):""}</div>`; }

function newListModal(){ showModal(`<div class="mh"><h2>${t("tk_newList")}</h2><button class="iconbtn" data-close>${I.x}</button></div>
  <div class="mb"><div class="field"><label>${t("tk_listName")}</label><input id="tl-name" autofocus></div>
  <div class="field"><label>${t("tk_color")}</label><div class="svc-list" id="tl-colors">${LIST_COLORS.map((c,i)=>`<button type="button" class="${i===0?"on":""}" data-tcolor="${c}" style="${i===0?"border-color:var(--accent)":""}"><span class="dot" style="background:${c}"></span></button>`).join("")}</div></div></div>
  <div class="mf"><button class="btn" data-close>${t("cancel")}</button><button class="btn primary" data-tcreate-list>${t("tk_create")}</button></div>`); setTimeout(()=>{ const n=document.getElementById("tl-name"); if(n) n.focus(); },30); }
let tlColor=LIST_COLORS[0];
function createList(){ const n=(document.getElementById("tl-name")||{}).value||""; const name=n.trim(); if(!name) return; let id=slug(name); while(id==="inbox"||listOf(id)) id+="-"+Math.random().toString(36).slice(2,5); S.lists.push({id,name,color:tlColor}); persist(); closeModal(); tgo("list:"+id); }

/* ============ Reminders ============ */
let shownKeys=new Set();
function checkReminders(){
  const td=todayD(); const due=[];
  S.subs.filter(isLive).forEach(s=>{ const nx=nextCharge(s); const n=daysBetween(td,nx); const st=chargeState(s,nx); if(n<=(s.remind??2)&&st.status!=="paid"&&!(st.snoozedUntil&&st.snoozedUntil>Date.now())) due.push({s,nx,n}); });
  const old=document.getElementById("remind-box"); if(old) old.remove();
  if(!due.length) return;
  due.sort((a,b)=>a.n-b.n); const d=due[0];
  const box=document.createElement("div"); box.className="remind"; box.id="remind-box";
  box.innerHTML=`<div class="row">${logoHtml(d.s,32)}<div class="grow"><div style="font-weight:700">${t("reminderTitle",{name:esc(d.s.name),when:relDay(d.nx)})}</div><div class="small muted">${t("reminderBody",{amt:fmtIn(d.s.amount,d.s.cur),cycle:t("cy_"+d.s.cycle)})}${due.length>1?` · +${due.length-1}`:""}</div></div></div>
   <div class="actions"><button class="btn sm primary" data-paid="${d.s.id}|${iso(d.nx)}">${t("paid")}</button><button class="btn sm" data-snooze="${d.s.id}|${iso(d.nx)}">${t("snooze")}</button></div>`;
  document.body.appendChild(box);
  const key=d.s.id+"|"+iso(d.nx);
  if(S.settings.notif&&"Notification" in window&&Notification.permission==="granted"&&!shownKeys.has(key)){ shownKeys.add(key); try{ new Notification(t("reminderTitle",{name:d.s.name,when:relDay(d.nx)}),{body:t("reminderBody",{amt:fmtIn(d.s.amount,d.s.cur),cycle:t("cy_"+d.s.cycle)})}); }catch(e){} }
}

/* ============ Events ============ */
function bind(){}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go],[data-add],[data-open],[data-paid],[data-snooze],[data-close],[data-close-bg],[data-edit],[data-del],[data-save],[data-cal],[data-set],[data-notif],[data-export],[data-wipe],[data-load-sample],[data-clear-sample],[data-svc],[data-app],[data-tgo],[data-tdone],[data-topen],[data-tdel],[data-tclose],[data-tpri],[data-tsub],[data-tsubdel],[data-tnewlist],[data-tcreate-list],[data-tcolor],[data-tdellist],[data-tclear-done],[data-tshowdone],[data-tclear-sample]");
  if(!b) return;
  /* tasks */
  if(b.dataset.app){ setApp(b.dataset.app); return; }
  if(b.dataset.tgo){ tgo(b.dataset.tgo); return; }
  if(b.dataset.tdone){ toggleTask(b.dataset.tdone); return; }
  if(b.dataset.topen){ if(e.target.closest("input,select,textarea,button")) return; openTask(b.dataset.topen); return; }
  if(b.hasAttribute("data-tclose")){ tsel=null; closeModal(); render(); return; }
  if(b.dataset.tdel){ const id=b.dataset.tdel; confirmBox(t("tk_confirmDel"),()=>{ S.tasks=S.tasks.filter(x=>x.id!==id); if(tsel===id) tsel=null; persist(); toast(t("deleted")); render(); }); return; }
  if(b.dataset.tpri!==undefined){ setField(b.dataset.tid,"pri",+b.dataset.tpri); render(); refreshMobileDetail(); return; }
  if(b.dataset.tsub){ const [tid,sid]=b.dataset.tsub.split("|"); const x=S.tasks.find(y=>y.id===tid); const s=x&&x.subs.find(z=>z.id===sid); if(s){ s.done=!s.done; persist(); render(); refreshMobileDetail(); } return; }
  if(b.dataset.tsubdel){ const [tid,sid]=b.dataset.tsubdel.split("|"); const x=S.tasks.find(y=>y.id===tid); if(x){ x.subs=x.subs.filter(z=>z.id!==sid); persist(); render(); refreshMobileDetail(); } return; }
  if(b.hasAttribute("data-tnewlist")){ newListModal(); return; }
  if(b.hasAttribute("data-tcreate-list")){ createList(); return; }
  if(b.dataset.tcolor){ tlColor=b.dataset.tcolor; document.querySelectorAll("#tl-colors button").forEach(x=>x.style.borderColor=x===b?"var(--accent)":"var(--line)"); return; }
  if(b.dataset.tdellist){ const id=b.dataset.tdellist; confirmBox(t("tk_confirmDelList"),()=>{ S.lists=S.lists.filter(l=>l.id!==id); S.tasks=S.tasks.filter(x=>x.list!==id); persist(); tgo("inbox"); }); return; }
  if(b.hasAttribute("data-tclear-done")){ confirmBox(t("tk_clearDone")+"?",()=>{ S.tasks=S.tasks.filter(x=>!x.done); persist(); render(); }); return; }
  if(b.hasAttribute("data-tshowdone")){ tShowDone=!tShowDone; render(); return; }
  if(b.hasAttribute("data-tclear-sample")){ S.tasks=S.tasks.filter(x=>!x.sample); persist(); render(); return; }
  /* easyremind */
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.hasAttribute("data-add")){ editSub(""); return; }
  if(b.dataset.open){ e.stopPropagation(); openSub(b.dataset.open); return; }
  if(b.dataset.paid){ markPaid(b.dataset.paid); return; }
  if(b.dataset.snooze){ const tm=new Date(); tm.setDate(tm.getDate()+1); tm.setHours(9,0,0,0); S.charges[b.dataset.snooze]={status:"snoozed",snoozedUntil:tm.getTime()}; persist(); toast(t("snoozed")); render(); return; }
  if(b.hasAttribute("data-close")){ closeModal(); return; }
  if(b.hasAttribute("data-close-bg")){ if(e.target===b) closeModal(); return; }
  if(b.dataset.edit){ editSub(b.dataset.edit); return; }
  if(b.dataset.del){ const id=b.dataset.del; confirmBox(t("confirmDel"),()=>{ S.subs=S.subs.filter(x=>x.id!==id); persist(); toast(t("deleted")); render(); }); return; }
  if(b.hasAttribute("data-save")){ saveSub(); return; }
  if(b.dataset.cal!==undefined){ const n=parseInt(b.dataset.cal); if(n===0) calMonth=new Date(todayD().getFullYear(),todayD().getMonth(),1); else calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1); render(); return; }
  if(b.dataset.set){ S.settings[b.dataset.set]=b.dataset.v; persist(); render(); return; }
  if(b.hasAttribute("data-notif")){ Notification.requestPermission().then(p=>{ S.settings.notif=p==="granted"; persist(); render(); }).catch(()=>render()); return; }
  if(b.hasAttribute("data-export")){ const ta=document.getElementById("s-exp"); ta.style.display="block"; ta.value=JSON.stringify({app:"EasyRemind",version:1,exported:new Date().toISOString(),...S},null,2); ta.select(); try{ navigator.clipboard.writeText(ta.value).then(()=>toast("Copied")); }catch(_){} return; }
  if(b.hasAttribute("data-wipe")){ confirmBox(t("confirmWipe"),()=>{ S=defaultState(); S.sampleLoaded=true; S.tasksSeeded=true; persist(); render(); }); return; }
  if(b.hasAttribute("data-load-sample")){ loadSample(); render(); return; }
  if(b.hasAttribute("data-clear-sample")){ S.subs=S.subs.filter(s=>!s.sample); persist(); render(); return; }
  if(b.dataset.svc){ const c=CATALOGUE.find(x=>x.slug===b.dataset.svc); document.getElementById("f-name").value=c.name; document.getElementById("f-amount").value=c.price; document.getElementById("f-cur").value=c.cur; document.getElementById("f-cycle").value=c.cycle; document.getElementById("f-cat").value=c.cat; document.getElementById("f-svc").value=c.slug; document.getElementById("f-amount").focus(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); if(app==="tasks"&&tsel){ tsel=null; render(); } }
  if(e.key==="Enter"&&e.target.id==="tq-add"){ e.preventDefault(); addTask(e.target.value); return; }
  if(e.key==="Enter"&&e.target.id==="td-newsub"){ e.preventDefault(); const x=S.tasks.find(y=>y.id===e.target.dataset.tid); const v=e.target.value.trim(); if(x&&v){ x.subs.push({id:uid(),title:v,done:false}); persist(); render(); refreshMobileDetail(); const n=document.getElementById("td-newsub"); if(n) n.focus(); } return; }
  if(e.key==="Enter"&&e.target.id==="tl-name"){ e.preventDefault(); createList(); return; }
  if(e.key==="Enter"&&e.target.classList.contains("trow")){ openTask(e.target.dataset.topen); return; }
  if(e.key==="Enter"&&e.target.closest("#subform")&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); saveSub(); } if(e.key==="Enter"&&e.target.classList.contains("card")) openSub(e.target.dataset.open); });
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="tq-search"){ tq=el.value; const pos=el.selectionStart; render(); const n=document.getElementById("tq-search"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(el.dataset.tf&&(el.dataset.tf==="title"||el.dataset.tf==="notes")){ setField(el.dataset.tid,el.dataset.tf,el.value); if(el.dataset.tf==="title"){ const r=document.querySelector(`.trow[data-topen="${el.dataset.tid}"] .tt`); if(r) r.textContent=el.value; } return; }
  if(el.id==="fl-q"){ filt.q=el.value; const pos=el.selectionStart; render(); const n=document.getElementById("fl-q"); n.focus(); n.setSelectionRange(pos,pos); }
  if(el.id==="s-payers"){ S.settings.payers=el.value; persist(); }
  if(el.dataset.rate){ const v=parseFloat(el.value); if(v>0){ S.settings.rates[el.dataset.rate]=v; persist(); } }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="tq-sort"){ tsort=el.value; render(); return; }
  if(el.dataset.tf){ setField(el.dataset.tid,el.dataset.tf,el.value); if(el.dataset.tf!=="notes") render(); return; }
  if(el.id==="fl-cat"){ filt.cat=el.value; render(); }
  if(el.id==="fl-st"){ filt.status=el.value; render(); }
  if(el.id==="fl-sort"){ filt.sort=el.value; render(); }
  if(el.id==="s-cur"){ S.settings.cur=el.value; persist(); render(); }
  if(el.id==="s-import"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d.subs)){ S.subs=d.subs; S.charges=d.charges||{}; if(d.settings) S.settings={...S.settings,...d.settings}; if(Array.isArray(d.tasks)) S.tasks=d.tasks; if(Array.isArray(d.lists)) S.lists=d.lists; S.sampleLoaded=true; persist(); toast(t("imported",{n:d.subs.length})); render(); } }catch(_){} }; r.readAsText(f); }
});
window.addEventListener("hashchange",()=>{ const a=app,v=view,tv=tview; readHash(); if(a!==app||v!==view||tv!==tview){ tsel=null; render(); } });
setInterval(checkReminders,60000);
render();
</script>
