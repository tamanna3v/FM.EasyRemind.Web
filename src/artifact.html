<title>EasyRemind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: website shell. Left = sidebar of vertical app tabs (EasyDo Utilities; EasyRemind first, room for more).
   Right = the active app's single page: sticky app header + horizontal section tabs + content.
   Phone: the sidebar slides in as a drawer from the menu button; section tabs scroll sideways. */
:root{
  --bg:#f3f6f5; --side:#e8efec; --surface:#ffffff; --surface-2:#e9efed; --line:#d5ddda;
  --fg:#15211e; --fg-2:#56655f; --fg-3:#8a9893;
  --accent:#0f7b74; --accent-fg:#ffffff; --accent-soft:#dcefec;
  --warn:#b4720a; --warn-soft:#fbefd6; --crit:#b9342c; --crit-soft:#fbe2df; --ok:#2a7d4f; --ok-soft:#ddf1e4;
  --scrim:rgba(10,16,15,.5);
  --font-display:"Manrope","Noto Sans Bengali",system-ui,sans-serif;
  --font-body:"Manrope","Noto Sans Bengali",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:12px; --shadow:0 1px 2px rgba(21,33,30,.06),0 4px 16px rgba(21,33,30,.06);
  --side-w:252px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --side:#0b1110; --surface:#161e1c; --surface-2:#1f2927; --line:#2b3835;
  --fg:#e8eeec; --fg-2:#a4b2ad; --fg-3:#6f7f79;
  --accent:#3fb8ae; --accent-fg:#06211e; --accent-soft:#163532;
  --warn:#e3a53a; --warn-soft:#3a2d12; --crit:#ee7a71; --crit-soft:#3d1c1a; --ok:#5fc48a; --ok-soft:#163626;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1514; --side:#0b1110; --surface:#161e1c; --surface-2:#1f2927; --line:#2b3835;
  --fg:#e8eeec; --fg-2:#a4b2ad; --fg-3:#6f7f79;
  --accent:#3fb8ae; --accent-fg:#06211e; --accent-soft:#163532;
  --warn:#e3a53a; --warn-soft:#3a2d12; --crit:#ee7a71; --crit-soft:#3d1c1a; --ok:#5fc48a; --ok-soft:#163626;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="bn"] body{font-family:"Noto Sans Bengali","Manrope",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800;line-height:1.15}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.small{font-size:.82rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:20px 14px 16px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;z-index:30}
.suite{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.suite-mark{width:32px;height:32px;display:grid;place-items:center;color:var(--accent);flex:none}
.suite-mark svg{width:28px;height:28px}
.suite-name{display:flex;flex-direction:column;line-height:1.15}
.suite-name b{font-family:var(--font-display);font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
.suite-name span{font-size:.74rem;color:var(--fg-2);letter-spacing:.04em}
.side-label{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding:0 10px}
.apps{display:flex;flex-direction:column;gap:4px}
.app-tab{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:var(--fg)}
.app-tab:hover:not(.active):not(.is-soon){background:var(--surface-2)}
.app-tab.active{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.app-tab.is-soon{cursor:default}
.app-txt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.app-txt b{font-family:var(--font-display);font-weight:800;font-size:.95rem}
.app-txt small{font-size:.76rem;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-tab.is-soon .app-txt b{color:var(--fg-2);font-weight:700}
.app-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);flex:none}
.app-ico svg{width:19px;height:19px}
.app-ico.lg{width:42px;height:42px;border-radius:12px}
.app-ico.lg svg{width:22px;height:22px}
.app-ico.ghost{background:transparent;color:var(--fg-3);border:1.5px dashed var(--line)}
.side-spacer{flex:1}
.side-foot{display:flex;flex-direction:column;gap:10px;padding:14px 4px 0;border-top:1px solid var(--line)}
.side-foot .seg{display:flex}
.side-foot .seg button{flex:1;display:grid;place-items:center}
.side-foot .ver{padding:0 4px}
.pane{min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1180px;padding-inline:clamp(16px,4vw,40px)}
.apptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.apphead{display:flex;align-items:center;gap:12px;padding-block:16px 8px}
.apptitle{flex:1;min-width:0}
.iconbtn.menu-btn{display:none}
.sectabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.sectabs::-webkit-scrollbar{display:none}
.sectab{display:inline-flex;align-items:center;gap:8px;padding:11px 14px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--fg-2);font-weight:700;white-space:nowrap;flex:none}
.sectab svg{width:17px;height:17px;flex:none}
.sectab:hover{color:var(--fg)}
.sectab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.main{min-width:0;padding-block:22px 72px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:55}

/* ---------- components ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn svg{width:16px;height:16px;flex:none}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);flex:none;padding:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.iconbtn-space{width:34px;flex:none}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.panel.hero{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.panel.hero .label{color:var(--accent-fg);opacity:.75}
.panel .big{font-size:1.9rem;font-weight:800;line-height:1.1;margin:6px 0 4px;font-family:var(--font-display)}
.panel.hero .big{font-size:2.2rem}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow,.grow{flex:1;min-width:0}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--fg-2);font-size:.85rem}
.viewbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.viewbar h2{font-size:1.3rem;font-weight:800}
.lede{margin:0 0 14px;color:var(--fg-2);font-size:.85rem}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#fff;flex:none;font-family:var(--font-display)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.pill.today{background:var(--crit-soft);color:var(--crit)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.creep{background:var(--crit-soft);color:var(--crit)}
.pill.trial{background:var(--accent-soft);color:var(--accent)}

/* subscriptions */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
.toolbar input{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .price{font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.card .pills{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--fg-2);border:1px dashed var(--line);border-radius:var(--radius)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--fg-3);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal .day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.other{opacity:.4}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d{font-size:.78rem;font-weight:700;color:var(--fg-2)}
.cal .ev{display:block;width:100%;border:0;border-left:3px solid var(--c);text-align:left;font-size:.72rem;font-weight:600;line-height:1.35;padding:2px 6px;border-radius:5px;background:var(--surface-2);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.paid{opacity:.55;text-decoration:line-through}
.cal .more{font-size:.7rem;color:var(--fg-3)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.bar i.past{background:var(--fg-3);opacity:.5}
.bar small{font-size:.66rem;color:var(--fg-3);white-space:nowrap}
.bar b{font-size:.66rem;font-family:var(--font-mono);color:var(--fg-2);font-weight:500}
.cat{display:flex;flex-direction:column;gap:8px}
.cat .r{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.cat .r .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cat .r .t i{display:block;height:100%;background:var(--accent)}
.cat .r.cat-ent i{background:#c2553f}.cat .r.cat-ai i{background:#5b6ee1}.cat .r.cat-prod i{background:#0f7b74}
.cat .r.cat-cloud i{background:#8a63d2}.cat .r.cat-util i{background:#b4720a}.cat .r.cat-health i{background:#2a7d4f}
.cat .r.cat-edu i{background:#2f80b5}.cat .r.cat-fin i{background:#6b7f78}.cat .r.cat-other i{background:#9aa5a1}
.ring{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring svg{width:120px;height:120px}

/* table */
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.tw{overflow-x:auto}

/* modal + forms */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:80}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--fg-2)}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%}
.field textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc-list{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto}
.svc-list button{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.svc-list button:hover{border-color:var(--accent)}
.svc-list .dot{width:12px;height:12px;border-radius:4px}
.steps{padding-left:20px;margin:0;display:grid;gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toggle:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:7px 12px;border:0;background:var(--surface);font-weight:600;font-size:.85rem;color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg button svg{width:16px;height:16px;display:block}
.seg.sm button{padding:6px 8px;font-size:.8rem}
.seg.sm button svg{width:15px;height:15px}
.seg select,.toggle select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}

/* reminder card + toast */
.remind{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px;box-shadow:var(--shadow);z-index:40;display:grid;gap:8px}
.remind .row{align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:90;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}


/* tasks app */
.tk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.tk.nodetail{grid-template-columns:minmax(0,1fr)}
.qadd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.qadd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qadd svg{width:18px;height:18px;color:var(--accent);flex:none}
.qadd input{flex:1;border:0;background:transparent;outline:none;font-size:.98rem;min-width:0}
.qadd .hint{font-size:.72rem;color:var(--fg-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;color:var(--fg-2)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .dotc{width:9px;height:9px;border-radius:3px;flex:none}
.chip.on .dotc{outline:2px solid rgba(255,255,255,.6)}
.chip svg{width:13px;height:13px}
.tlist{display:flex;flex-direction:column;gap:3px}
.tsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 6px 5px;display:flex;gap:8px;align-items:center}
.tsec b{font-family:var(--font-mono);color:var(--fg-3);font-weight:600}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;background:var(--surface);border:1px solid var(--line);min-width:0}
.trow:hover{border-color:var(--accent)}
.trow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.trow.done{opacity:.55}
.trow.done .tt{text-decoration:line-through}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg-3);flex:none;margin-top:3px;display:grid;place-items:center;background:transparent;padding:0;cursor:pointer}
.chk.p1{border-color:var(--crit)}.chk.p2{border-color:var(--warn)}.chk.p3{border-color:#2f80b5}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk svg{width:11px;height:11px}
.trow .tt{font-weight:600;line-height:1.35;word-break:break-word}
.trow .tm{display:flex;gap:9px;flex-wrap:wrap;font-size:.76rem;color:var(--fg-3);margin-top:2px;align-items:center}
.trow .tm .due{display:inline-flex;align-items:center;gap:3px}
.trow .tm .due svg{width:12px;height:12px}
.trow .tm .due.over{color:var(--crit);font-weight:700}.trow .tm .due.td{color:var(--accent);font-weight:700}
.tag{padding:0 6px;border-radius:5px;background:var(--surface-2);color:var(--fg-2);font-weight:600}
.lst{font-weight:700}
.detail{position:sticky;top:12px}
.detail textarea{min-height:110px}
.detail .title-in{font-size:1.05rem;font-weight:700;border:0;background:transparent;padding:4px 0;width:100%;outline:none;font-family:var(--font-display)}
.subt{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.subt:last-child{border-bottom:0}
.subt input[type=text]{flex:1;border:0;background:transparent;outline:none;min-width:0}
.subt.done span{text-decoration:line-through;color:var(--fg-3)}
.subt .chk{margin:0;width:16px;height:16px}
.prisel{display:flex;gap:6px}
.prisel button{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600}
.prisel button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.prisel button[data-tpri="1"].on{background:var(--crit);border-color:var(--crit);color:#fff}
.prisel button[data-tpri="2"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.prisel button[data-tpri="3"].on{background:#2f80b5;border-color:#2f80b5;color:#fff}
.kbd{font-family:var(--font-mono);font-size:.7rem;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}

  h1{font-size:1.15rem}
  .btn.primary.add{padding:9px 11px}
  .sectab{padding:10px 11px 11px}
  .main{padding-block:16px 120px}
  .g3,.f2{grid-template-columns:minmax(0,1fr)}

  .tk{grid-template-columns:minmax(0,1fr)}

}

  load(k){ try{ const r=localStorage.getItem(k); if(r) return JSON.parse(r); }catch(e){} return null; },
  save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

if(!S.settings.cur) S.settings.cur="BDT";
if(S.settings.payers===undefined) S.settings.payers="Me";

const t=(k,v)=>{ let s=(T[P.lang]||T.en)[k]; if(s===undefined) s=T.en[k]; if(typeof s==="string"&&v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; };

/* ============ Dates & money ============ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayD=()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
/* k-th charge counted from the first date, so the 31st stays the 31st (or month end) instead of drifting */
const addCycle=(d,cycle,k=1)=>{ const n=new Date(d); const c=CYCLES[cycle]; if(c.d){ n.setDate(n.getDate()+c.d*k); return n; } const day=n.getDate(); n.setDate(1); n.setMonth(n.getMonth()+c.m*k); const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(); n.setDate(Math.min(day,last)); return n; };
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
function nextCharge(sub,from=todayD()){ const f=parse(sub.first); for(let k=0;k<6000;k++){ const d=addCycle(f,sub.cycle,k); if(d>=from) return d; } return f; }
function chargesBetween(sub,a,b){ const f=parse(sub.first), out=[]; for(let k=0;k<6000;k++){ const d=addCycle(f,sub.cycle,k); if(d>b) break; if(d>=a) out.push(d); } return out; }
const monthly=sub=>sub.amount*CYCLES[sub.cycle].n;
function conv(amt,from,to=S.settings.cur){ const r=S.settings.rates; const f=r[from]||1, tt=r[to]||1; return amt/f*tt; }
function fmt(amt,cur=S.settings.cur){ const sym={BDT:"৳",USD:"$",EUR:"€",GBP:"£",INR:"₹"}[cur]||cur+" "; const n=amt>=1000?Math.round(amt).toLocaleString("en-US"):amt.toFixed(2); return sym+n; }
const fmtIn=(amt,from)=>fmt(conv(amt,from));
function fmtDate(d){ return d.getDate()+" "+t("months")[d.getMonth()]+(d.getFullYear()!==todayD().getFullYear()?" "+d.getFullYear():""); }
function relDay(d){ const n=daysBetween(todayD(),d); if(n===0) return t("today"); if(n===1) return t("tomorrow"); if(n<0) return t("overdue",{n:-n}); return t("inDays",{n}); }
const chargeKey=(sub,d)=>sub.id+"|"+iso(d);
const chargeState=(sub,d)=>S.charges[chargeKey(sub,d)]||{status:"upcoming"};
const isLive=s=>s.status==="active"||s.status==="trial";
const svcOf=sub=>CATALOGUE.find(c=>c.slug===sub.svc);
const colorOf=sub=>sub.color||(svcOf(sub)||{}).color||"#6b7f78";
const initials=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const hasCreep=sub=>!!(sub.history&&sub.history.length&&sub.history[sub.history.length-1].amount<sub.amount);
/* history entries hold the OLD price and the date it stopped applying */
function priceAt(s,d){ if(!s.history||!s.history.length) return {amount:s.amount,cur:s.cur}; for(const h of s.history){ if(parse(h.from)>d) return {amount:h.amount,cur:h.cur}; } return {amount:s.amount,cur:s.cur}; }
function dueList(){ const td=todayD(), out=[]; S.subs.filter(isLive).forEach(s=>{ const nx=nextCharge(s); const n=daysBetween(td,nx); const st=chargeState(s,nx); if(n<=(s.remind??2)&&st.status!=="paid"&&!(st.snoozedUntil&&st.snoozedUntil>Date.now())) out.push({s,nx,n}); }); return out.sort((a,b)=>a.n-b.n); }

/* ============ Sample ============ */
function loadSample(){ const td=todayD(); SAMPLE.forEach(s=>{ const c=CATALOGUE.find(x=>x.slug===s.svc); if(!c) return; const d=new Date(td); d.setDate(d.getDate()+s.first); S.subs.push({id:uid(),svc:c.slug,name:c.name,amount:s.amount||c.price,cur:c.cur,cycle:s.cycle||c.cycle,cat:c.cat,first:iso(d),status:"active",payer:"Me",remind:2,notes:"",method:c.cur==="BDT"?"bKash":"Card",history:[],sample:true,created:Date.now()}); });
  const nf=S.subs.find(x=>x.svc==="netflix"&&x.sample); if(nf) nf.history=[{amount:13.99,cur:"USD",from:iso(new Date(td.getFullYear()-1,td.getMonth(),1))}];
  S.sampleLoaded=true; persist(); }

const appOf=id=>APPS.find(a=>a.id===id)||APPS[0];
const LEGACY={dashboard:1,subs:1,calendar:1,analytics:1,settings:1};
function parseHash(){
  const h=(location.hash||"").slice(1);
  if(LEGACY[h]) return {app:"remind",sec:h};
  const [a,s]=h.split(".");
  const app=appOf(a);
  return {app:app.id,sec:(app.sections.find(x=>x[1]===s)||app.sections[0])[0]};
}
function hashOf(r){ const app=appOf(r.app); return "#"+app.id+"."+(app.sections.find(x=>x[0]===r.sec)||app.sections[0])[1]; }
let route=parseHash(), drawerOpen=false;

function go(r,opts={}){

}

function rAna(){
  const live=S.subs.filter(isLive); const td=todayD();
  const months=[]; for(let i=-6;i<=11;i++){ const a=new Date(td.getFullYear(),td.getMonth()+i,1), b=new Date(td.getFullYear(),td.getMonth()+i+1,0); let v=0;
    S.subs.forEach(s=>{ if(!isLive(s)&&!(s.cancelled&&parse(s.cancelled)>a)) return; chargesBetween(s,a,b).forEach(d=>{ if(s.cancelled&&d>parse(s.cancelled)) return; const h=priceAt(s,d); v+=conv(h.amount,h.cur); }); });
    months.push({a,v,i}); }
  const max=Math.max(...months.map(x=>x.v),1);
  const fut=months.filter(x=>x.i>=0), past=months.filter(x=>x.i<0);
  const avgF=fut.reduce((a,x)=>a+x.v,0)/fut.length, avgP=past.reduce((a,x)=>a+x.v,0)/past.length;
  const byCat={}; live.forEach(s=>{byCat[s.cat]=(byCat[s.cat]||0)+conv(monthly(s),s.cur)}); const mo=Object.values(byCat).reduce((a,b)=>a+b,0)||1;

  let acc=0; const arcs=cats.map(([c,v])=>{ const p=v/mo; const s=acc; acc+=p; return `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${palette[c]}" stroke-width="6" stroke-dasharray="${(p*100).toFixed(2)} ${(100-p*100).toFixed(2)}" stroke-dashoffset="${(25-s*100).toFixed(2)}"/>`; }).join("");
  const sorted=live.slice().sort((a,b)=>conv(monthly(a),a.cur)-conv(monthly(b),b.cur));
  const oldest=live.slice().sort((a,b)=>parse(a.first)-parse(b.first))[0];
  const creep=S.subs.filter(hasCreep);
  const pick=(label,s,sub)=>`<div class="panel"><div class="label">${label}</div><div class="row" style="margin-top:8px">${logoHtml(s,32)}<div class="grow"><div class="ellip" style="font-weight:700">${esc(s.name)}</div><div class="small muted">${sub}</div></div></div></div>`;
  return `
  <p class="lede">${t("yearForecastNote")}</p>
  <div class="panel" style="margin-bottom:14px"><div class="panel-h"><h2>${t("forecast")}</h2><span class="small muted">${t("avg")} <span class="num">${fmt(avgF)}</span>${t("perMonthShort")}</span></div>
    <div class="bars">${months.map(x=>`<div class="bar"><b>${x.v>=1000?Math.round(x.v/1000)+"k":Math.round(x.v)}</b><i class="${x.i<0?"past":""}" style="height:${(x.v/max*100).toFixed(1)}%"></i><small>${t("months")[x.a.getMonth()]}</small></div>`).join("")}</div>
    <div class="small muted" style="margin-top:8px">${t("history")}: ${t("avg")} <span class="num">${fmt(avgP)}</span>${t("perMonthShort")} (6 mo) → ${t("forecast").toLowerCase()} <span class="num">${fmt(avgF)}</span>${t("perMonthShort")}</div></div>

/* quick-add parser: dates (today/tomorrow/weekday/in N days/25/10/2026-10-25, Bangla আজ/কাল), !high/!med/!low, #tag, ~list */
function parseQuick(s){ const td=todayD(); let title=" "+s+" ", due="", pri=0, list=null, tags=[];
  const rep=(re,fn)=>{ title=title.replace(re,(...a)=>{ fn(...a); return " "; }); };
  const setD=n=>{ const x=new Date(td); x.setDate(x.getDate()+n); due=iso(x); };
  rep(/\s!(high|h|1)(?=\s)/gi,()=>pri=1); rep(/\s!(med|medium|m|2)(?=\s)/gi,()=>pri=2); rep(/\s!(low|l|3)(?=\s)/gi,()=>pri=3);
  rep(/\s#([\p{L}\p{N}_-]+)/gu,(m,tg)=>tags.push(tg.toLowerCase()));
  rep(/\s~([\p{L}\p{N}_-]+)/gu,(m,ln)=>{ const l=TS.lists.find(x=>x.name.toLowerCase()===ln.toLowerCase()||x.id===ln.toLowerCase()); list=l?l.id:(/^inbox$/i.test(ln)?"inbox":list); });
  rep(/\s(\d{4}-\d{2}-\d{2})(?=\s)/,(m,d)=>due=d);
  rep(/\s(\d{1,2})\/(\d{1,2})(?=\s)/,(m,dd,mm)=>{ let x=new Date(td.getFullYear(),mm-1,dd); if(x<td) x=new Date(td.getFullYear()+1,mm-1,dd); due=iso(x); });
  rep(/\s(today|tod|আজ|আজকে)(?=\s)/i,()=>setD(0)); rep(/\s(tomorrow|tmr|tmrw|tom|কাল|কালকে|আগামীকাল)(?=\s)/i,()=>setD(1));
  rep(/\snext week(?=\s)/i,()=>setD(7)); rep(/\sআগামী সপ্তাহ(?=\s)/,()=>setD(7));
  rep(/\sin (\d+) days?(?=\s)/i,(m,n)=>setD(+n)); rep(/\s(\d+) দিন পর(?=\s)/,(m,n)=>setD(+n));
  rep(/\s(?:next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?=\s)/i,(m,d)=>{ const i=["sun","mon","tue","wed","thu","fri","sat"].indexOf(d.toLowerCase().slice(0,3)); let n=(i-td.getDay()+7)%7; if(n===0) n=7; setD(n); });
  return {title:title.replace(/\s+/g," ").trim(),due,pri,list,tags}; }

function addTask(raw){ const p=parseQuick(raw); if(!p.title) return;
  let list=p.list||"inbox", due=p.due, tags=p.tags;
  if(tfilter&&tfilter.list&&!p.list) list=tfilter.list;
  if(tfilter&&tfilter.tag&&!tags.includes(tfilter.tag)) tags.push(tfilter.tag);
  if(route.sec==="ttoday"&&!due) due=iso(todayD());
  if(route.sec==="tinbox") list="inbox";
  TS.tasks.unshift({id:uid(),title:p.title,notes:"",due,pri:p.pri,list,tags,subs:[],done:false,created:Date.now()}); persistT(); render(); const el=$("tq-add"); if(el) el.focus(); }

function tPred(sec){ const td=iso(todayD()), wk=weekIso();
  const base=sec==="tinbox"?x=>x.list==="inbox":sec==="ttoday"?x=>x.due&&x.due<=td:sec==="tweek"?x=>x.due&&x.due<=wk:()=>true;
  const f=tfilter?(tfilter.list?x=>x.list===tfilter.list:x=>x.tags.includes(tfilter.tag)):()=>true;
  return x=>base(x)&&f(x); }
function tFilter(sec,done=false){ const p=tPred(sec); let l=TS.tasks.filter(x=>p(x)&&x.done===(sec==="tdone"?true:done));
  if(tq){ const q=tq.toLowerCase(); l=l.filter(x=>(x.title+" "+x.notes+" "+x.tags.join(" ")).toLowerCase().includes(q)); }
  return l; }
function tSort(l){ const pr=x=>x.pri===0?4:x.pri;
  return l.sort((a,b)=>{ if(tsort==="pri") return pr(a)-pr(b)||(a.due||"9999").localeCompare(b.due||"9999"); if(tsort==="created") return b.created-a.created; return (a.due||"9999").localeCompare(b.due||"9999")||pr(a)-pr(b)||b.created-a.created; }); }
function dowName(d){ return ({en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],bn:["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"]})[P.lang==="bn"?"bn":"en"][d.getDay()]; }
function tGroups(sec,l){ const td=iso(todayD()), wk=weekIso();
  if(sec==="tdone"){ const g={}; l.slice().sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).forEach(x=>{ const k=x.doneAt?iso(new Date(x.doneAt)):""; (g[k]=g[k]||[]).push(x); }); return Object.keys(g).sort().reverse().map(k=>[k?(k===td?t("ttoday"):fmtDate(parse(k))):"",g[k]]); }
  if(sec==="tweek"||sec==="ttoday"){ const g={}; l.forEach(x=>{ const k=x.due<td?"0000-overdue":x.due; (g[k]=g[k]||[]).push(x); }); return Object.keys(g).sort().map(k=>[k==="0000-overdue"?t("tk_overdue"):k===td?t("ttoday"):fmtDate(parse(k))+" · "+dowName(parse(k)),g[k]]); }
  const g={over:[],today:[],week:[],later:[],none:[]}; l.forEach(x=>{ if(!x.due) g.none.push(x); else if(x.due<td) g.over.push(x); else if(x.due===td) g.today.push(x); else if(x.due<=wk) g.week.push(x); else g.later.push(x); });
  return [[t("tk_overdue"),g.over],[t("ttoday"),g.today],[t("tweek"),g.week],[t("tk_later"),g.later],[t("tk_nodate"),g.none]].filter(x=>x[1].length); }

  const tags=[...new Set(TS.tasks.filter(open).flatMap(x=>x.tags))].sort();

    <div class="field"><label>${t("tk_pri")}</label><div class="prisel">${[1,2,3,0].map(p=>`<button class="${x.pri===p?"on":""}" data-tpri="${p}" data-tid="${x.id}">${t("pri"+p)}</button>`).join("")}</div></div>
    <div class="field"><label>${t("tk_tagsF")}</label><input data-tf="tags" data-tid="${x.id}" value="${esc(x.tags.join(", "))}"></div>
    <div class="field"><label>${t("tk_sub")}</label><div>${x.subs.map(s=>`<div class="subt ${s.done?"done":""}"><button class="chk ${s.done?"on":""}" data-tsub="${x.id}|${s.id}">${s.done?I.check:""}</button><span class="grow">${esc(s.title)}</span><button class="iconbtn" style="width:26px;height:26px;border:0" data-tsubdel="${x.id}|${s.id}" aria-label="${t("delete")}">${I.x}</button></div>`).join("")}
     <div class="subt"><span class="muted" style="width:16px;text-align:center">+</span><input type="text" id="td-newsub" data-tid="${x.id}" placeholder="${t("tk_addSub")}"></div></div></div>
    <div class="field"><label>${t("tk_notes")}</label><textarea data-tf="notes" data-tid="${x.id}">${esc(x.notes)}</textarea></div>
   </div></div>`; }

function rTasks(sec){ if(tfilter&&tfilter.list&&!listOf(tfilter.list)) tfilter=null;
  const l=tSort(tFilter(sec)); const groups=tGroups(sec,l);
  const doneExtra=tShowDone&&sec!=="tdone"?tFilter(sec,true).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)):[];
  const lo=tfilter&&tfilter.list?listOf(tfilter.list):null;
  const td=todayD(); const over=TS.tasks.filter(x=>!x.done&&x.due&&x.due<iso(td)).length;
  const showDetail=tsel&&!isMobile()&&TS.tasks.some(x=>x.id===tsel);
  return `
  <div class="viewbar" style="margin-bottom:8px"><div><h2>${esc(lo?lo.name:tfilter?"#"+tfilter.tag:t(sec))}</h2><div class="small muted">${sec==="tdone"?l.length:`${l.length} ${t("tk_open")}${over&&sec!=="ttoday"?` · <span style="color:var(--crit)">${over} ${t("tk_overdue").toLowerCase()}</span>`:""}`} · ${fmtDate(td)} ${dowName(td)}</div></div>
   <div class="actions">${lo?`<button class="btn sm danger" data-tdellist="${esc(lo.id)}">${I.trash}<span class="hide-sm">${t("tk_delList")}</span></button>`:""}${sec==="tdone"?`<button class="btn sm" data-tclear-done>${t("tk_clearDone")}</button>`:`<button class="btn sm ${tShowDone?"primary":""}" data-tshowdone>${tShowDone?t("tk_hideDone"):t("tk_showDone")}</button>`}</div></div>
  ${TS.tasks.some(x=>x.sample)?`<div class="notice">${t("tk_sample")} <button class="btn sm" data-tclear-sample style="margin-left:6px">${t("tk_clearSample")}</button></div>`:""}
  <div class="tk ${showDetail?"":"nodetail"}"><div>
   ${sec!=="tdone"?`<div class="qadd">${I.plus}<input id="tq-add" placeholder="${t("tk_add")}" autocomplete="off" aria-label="${t("tk_add")}"><span class="hint">${t("tk_hint")}</span></div><div class="small muted" style="margin:0 0 4px 4px">${t("tk_syntax")}</div>`:""}
   ${tChips(sec)}
   <div class="ttool"><input id="tq-search" placeholder="${t("tk_search")}" value="${esc(tq)}" aria-label="${t("tk_search")}"><select id="tq-sort" aria-label="sort"><option value="due" ${tsort==="due"?"selected":""}>${t("tk_sortDue")}</option><option value="pri" ${tsort==="pri"?"selected":""}>${t("tk_sortPri")}</option><option value="created" ${tsort==="created"?"selected":""}>${t("tk_sortCreated")}</option></select></div>
   ${groups.length?groups.map(([h,items])=>`${h?`<div class="tsec">${h}<b>${items.length}</b></div>`:""}<div class="tlist">${items.map(tRow).join("")}</div>`).join(""):`<div class="empty">${t("tk_empty")}</div>`}
   ${doneExtra.length?`<div class="tsec">${t("tdone")}<b>${doneExtra.length}</b></div><div class="tlist">${doneExtra.map(tRow).join("")}</div>`:""}
   ${sec==="tdone"?`<div class="actions" style="margin-top:18px"><button class="btn sm" data-texport>${t("tk_export")}</button><label class="btn sm">${t("tk_import")}<input type="file" id="t-import" accept="application/json" hidden></label></div><textarea id="t-exp" hidden style="width:100%;min-height:120px;margin-top:10px;font-family:var(--font-mono);font-size:.8rem"></textarea>`:""}
  </div>${showDetail?tDetail(tsel):""}</div>`; }

let tlColor=LIST_COLORS[0];
function newListModal(){ tlColor=LIST_COLORS[TS.lists.length%LIST_COLORS.length]; showModal(`<div class="mh"><h2>${t("tk_newList")}</h2><button class="iconbtn" data-close aria-label="${t("cancel")}">${I.x}</button></div>
  <div class="mb"><div class="field"><label>${t("tk_listName")}</label><input id="tl-name"></div>
  <div class="field"><label>${t("tk_color")}</label><div class="svc-list" id="tl-colors">${LIST_COLORS.map(c=>`<button type="button" data-tcolor="${c}" style="${c===tlColor?"border-color:var(--accent)":""}" aria-label="${c}"><span class="dot" style="background:${c}"></span></button>`).join("")}</div></div></div>
  <div class="mf"><button class="btn" data-close>${t("cancel")}</button><button class="btn primary" data-tcreate-list>${t("tk_create")}</button></div>`); }
function createList(){ const n=($("tl-name")||{}).value||""; const name=n.trim(); if(!name) return; let id=slugT(name); while(id==="inbox"||listOf(id)) id+="-"+Math.random().toString(36).slice(2,5); TS.lists.push({id,name,color:tlColor}); persistT(); closeModal(); tfilter={list:id}; tsel=null; if(route.sec==="tinbox"||route.sec==="tdone") go({app:"tasks",sec:"tall"}); else render(); }

/* ============ Reminders ============ */
const shownKeys=new Set();
function checkReminders(){
  const old=$("remind-box"); if(old) old.remove();
  const due=dueList(); if(!due.length) return;
  const d=due[0];
  const box=document.createElement("div"); box.className="remind"; box.id="remind-box"; box.setAttribute("role","status");
  box.innerHTML=`<div class="row">${logoHtml(d.s,32)}<div class="grow"><div style="font-weight:700">${t("reminderTitle",{name:esc(d.s.name),when:relDay(d.nx)})}</div><div class="small muted">${t("reminderBody",{amt:fmtIn(d.s.amount,d.s.cur),cycle:t("cy_"+d.s.cycle)})}${due.length>1?` · +${due.length-1}`:""}</div></div></div>
   <div class="actions"><button class="btn sm primary" data-paid="${d.s.id}|${iso(d.nx)}">${t("paid")}</button><button class="btn sm" data-snooze="${d.s.id}|${iso(d.nx)}">${t("snooze")}</button></div>`;
  document.body.appendChild(box);
  const key=d.s.id+"|"+iso(d.nx);
  if(S.settings.notif&&"Notification" in window&&Notification.permission==="granted"&&!shownKeys.has(key)){ shownKeys.add(key); try{ new Notification(t("reminderTitle",{name:d.s.name,when:relDay(d.nx)}),{body:t("reminderBody",{amt:fmtIn(d.s.amount,d.s.cur),cycle:t("cy_"+d.s.cycle)})}); }catch(e){} }
}

/* ============ Events ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tfilter],[data-tdone],[data-topen],[data-tdel],[data-tclose],[data-tpri],[data-tsub],[data-tsubdel],[data-tnewlist],[data-tcreate-list],[data-tcolor],[data-tdellist],[data-tclear-done],[data-tshowdone],[data-tclear-sample],[data-texport],[data-sec],[data-app],[data-drawer],[data-drawer-close],[data-pref],[data-add],[data-open],[data-paid],[data-snooze],[data-close],[data-close-bg],[data-edit],[data-del],[data-save],[data-cal],[data-notif],[data-export],[data-wipe],[data-load-sample],[data-clear-sample],[data-svc]");
  if(!b) return;
  const d=b.dataset;
  /* tasks */
  if(d.tfilter!==undefined){ const v=d.tfilter; tfilter=!v?null:v.startsWith("list:")?{list:v.slice(5)}:{tag:v.slice(4)}; tsel=null; render(); return; }
  if(d.tdone){ toggleTask(d.tdone); return; }
  if(d.topen){ if(e.target.closest("input,select,textarea,button")) return; openTask(d.topen); return; }
  if(b.hasAttribute("data-tclose")){ tsel=null; closeModal(); render(); return; }
  if(d.tdel){ const id=d.tdel; confirmBox(t("tk_confirmDel"),()=>{ TS.tasks=TS.tasks.filter(x=>x.id!==id); if(tsel===id) tsel=null; persistT(); toast(t("deleted")); render(); }); return; }
  if(d.tpri!==undefined){ setField(d.tid,"pri",+d.tpri); render(); refreshMobileDetail(); return; }
  if(d.tsub){ const [tid,sid]=d.tsub.split("|"); const x=TS.tasks.find(y=>y.id===tid); const s=x&&x.subs.find(z=>z.id===sid); if(s){ s.done=!s.done; persistT(); render(); refreshMobileDetail(); } return; }
  if(d.tsubdel){ const [tid,sid]=d.tsubdel.split("|"); const x=TS.tasks.find(y=>y.id===tid); if(x){ x.subs=x.subs.filter(z=>z.id!==sid); persistT(); render(); refreshMobileDetail(); } return; }
  if(b.hasAttribute("data-tnewlist")){ newListModal(); return; }
  if(b.hasAttribute("data-tcreate-list")){ createList(); return; }
  if(d.tcolor){ tlColor=d.tcolor; document.querySelectorAll("#tl-colors button").forEach(x=>x.style.borderColor=x===b?"var(--accent)":"var(--line)"); return; }
  if(d.tdellist){ const id=d.tdellist; confirmBox(t("tk_confirmDelList"),()=>{ TS.lists=TS.lists.filter(l=>l.id!==id); TS.tasks=TS.tasks.filter(x=>x.list!==id); tfilter=null; tsel=null; persistT(); render(); }); return; }
  if(b.hasAttribute("data-tclear-done")){ confirmBox(t("tk_clearDone")+"?",()=>{ TS.tasks=TS.tasks.filter(x=>!x.done); persistT(); render(); }); return; }
  if(b.hasAttribute("data-tshowdone")){ tShowDone=!tShowDone; render(); return; }
  if(b.hasAttribute("data-tclear-sample")){ TS.tasks=TS.tasks.filter(x=>!x.sample); persistT(); render(); return; }
  if(b.hasAttribute("data-texport")){ const ta=$("t-exp"); ta.hidden=false; ta.value=JSON.stringify({app:"EasyTasks",version:1,exported:new Date().toISOString(),tasks:TS.tasks,lists:TS.lists},null,2); ta.select(); try{ navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied"))).catch(()=>{}); }catch(_){} return; }
  /* shell + easyremind */
  if(d.sec){ tsel=null; go({sec:d.sec},{focusTab:b.classList.contains("sectab")}); return; }
  if(d.app){ if(d.app!==route.app) go({app:d.app,sec:appOf(d.app).sections[0][0]}); if(drawerOpen) setDrawer(false); return; }
  if(b.hasAttribute("data-drawer")){ setDrawer(!drawerOpen); return; }
  if(b.hasAttribute("data-drawer-close")){ setDrawer(false); return; }
  if(d.pref){ P[d.pref]=d.v; savePrefs(); render(); return; }
  if(b.hasAttribute("data-add")){ editSub(""); return; }
  if(d.open){ openSub(d.open); return; }
  if(d.paid){ markPaid(d.paid); return; }
  if(d.snooze){ const tm=new Date(); tm.setDate(tm.getDate()+1); tm.setHours(9,0,0,0); S.charges[d.snooze]={status:"snoozed",snoozedUntil:tm.getTime()}; persist(); toast(t("snoozed")); render(); return; }
  if(b.hasAttribute("data-close")){ closeModal(); return; }
  if(b.hasAttribute("data-close-bg")){ if(e.target===b) closeModal(); return; }
  if(d.edit){ editSub(d.edit); return; }
  if(d.del){ const id=d.del; confirmBox(t("confirmDel"),()=>{ S.subs=S.subs.filter(x=>x.id!==id); persist(); toast(t("deleted")); render(); }); return; }
  if(b.hasAttribute("data-save")){ saveSub(); return; }
  if(d.cal!==undefined){ const n=parseInt(d.cal,10); calMonth=n===0?new Date(todayD().getFullYear(),todayD().getMonth(),1):new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1); render(); return; }
  if(b.hasAttribute("data-notif")){ try{ Notification.requestPermission().then(p=>{ S.settings.notif=p==="granted"; persist(); render(); }).catch(()=>render()); }catch(_){ render(); } return; }
  if(b.hasAttribute("data-export")){ const ta=$("s-exp"); ta.hidden=false; ta.value=JSON.stringify({app:"EasyRemind",version:1,exported:new Date().toISOString(),...S},null,2); ta.select(); try{ navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied"))).catch(()=>{}); }catch(_){} return; }
  if(b.hasAttribute("data-wipe")){ confirmBox(t("confirmWipe"),()=>{ S=defaultState(); S.sampleLoaded=true; persist(); render(); }); return; }
  if(b.hasAttribute("data-load-sample")){ loadSample(); render(); return; }
  if(b.hasAttribute("data-clear-sample")){ S.subs=S.subs.filter(s=>!s.sample); persist(); render(); return; }
  if(d.svc){ const c=CATALOGUE.find(x=>x.slug===d.svc); if(!c) return; $("f-name").value=c.name; $("f-amount").value=c.price; $("f-cur").value=c.cur; $("f-cycle").value=c.cycle; $("f-cat").value=c.cat; $("f-svc").value=c.slug; $("f-amount").focus(); return; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("layer").innerHTML){ closeModal(); return; } if(drawerOpen){ setDrawer(false); return; } if(route.app==="tasks"&&tsel){ tsel=null; render(); return; } }
  if(e.key==="Enter"&&e.target.id==="tq-add"){ e.preventDefault(); addTask(e.target.value); return; }
  if(e.key==="Enter"&&e.target.id==="td-newsub"){ e.preventDefault(); const x=TS.tasks.find(y=>y.id===e.target.dataset.tid); const v=e.target.value.trim(); if(x&&v){ x.subs.push({id:uid(),title:v,done:false}); persistT(); render(); refreshMobileDetail(); const n=$("td-newsub"); if(n) n.focus(); } return; }
  if(e.key==="Enter"&&e.target.id==="tl-name"){ e.preventDefault(); createList(); return; }
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("trow")){ e.preventDefault(); openTask(e.target.dataset.topen); return; }
  const tab=e.target.closest&&e.target.closest(".sectab");
  if(tab&&["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){
    e.preventDefault();
    const ids=appOf(route.app).sections.map(x=>x[0]); let i=ids.indexOf(tab.dataset.sec);
    i=e.key==="Home"?0:e.key==="End"?ids.length-1:(i+(e.key==="ArrowRight"?1:-1)+ids.length)%ids.length;
    go({sec:ids[i]},{focusTab:true}); return;
  }
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#subform")&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); saveSub(); return; }
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){ e.preventDefault(); openSub(e.target.dataset.open); }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="tq-search"){ tq=el.value; const pos=el.selectionStart; render(); const n=$("tq-search"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(el.dataset&&el.dataset.tf&&(el.dataset.tf==="title"||el.dataset.tf==="notes")){ setField(el.dataset.tid,el.dataset.tf,el.value); if(el.dataset.tf==="title"){ const r=document.querySelector(`.trow[data-topen="${el.dataset.tid}"] .tt`); if(r) r.textContent=el.value; } return; }
  if(el.id==="fl-q"){ filt.q=el.value; const pos=el.selectionStart; render(); const n=$("fl-q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  if(el.id==="s-payers"){ S.settings.payers=el.value; persist(); }
  if(el.dataset&&el.dataset.rate){ const v=parseFloat(el.value); if(v>0){ S.settings.rates[el.dataset.rate]=v; persist(); } }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="tq-sort"){ tsort=el.value; render(); return; }
  if(el.dataset&&el.dataset.tf){ setField(el.dataset.tid,el.dataset.tf,el.value); if(el.dataset.tf!=="notes") render(); return; }
  if(el.id==="t-import"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d.tasks)){ TS.tasks=d.tasks; if(Array.isArray(d.lists)) TS.lists=d.lists; TS.seeded=true; persistT(); toast(t("tk_imported",{n:d.tasks.length})); render(); } }catch(_){} }; r.readAsText(f); return; }
  if(el.id==="fl-cat"){ filt.cat=el.value; render(); }
  if(el.id==="fl-st"){ filt.status=el.value; render(); }
  if(el.id==="fl-sort"){ filt.sort=el.value; render(); }
  if(el.id==="s-cur"){ S.settings.cur=el.value; persist(); render(); }
  if(el.id==="s-import"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d.subs)){ S.subs=d.subs; S.charges=d.charges||{}; if(d.settings){ const {lang,theme,...rest}=d.settings; S.settings={...S.settings,...rest}; if(lang) P.lang=lang; if(theme) P.theme=theme; savePrefs(); } S.sampleLoaded=true; persist(); toast(t("imported",{n:d.subs.length})); render(); } }catch(_){} }; r.readAsText(f); }
});
window.addEventListener("hashchange",()=>{ const r=parseHash(); if(r.app!==route.app||r.sec!==route.sec){ route=r; render(); } });
setInterval(checkReminders,60000);

if(!S.subs.length&&!S.sampleLoaded) loadSample();
render();
</script>
